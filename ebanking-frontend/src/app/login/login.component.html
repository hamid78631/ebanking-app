<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light p-3">
  <div class="card border-0 shadow-lg" style="max-width: 450px; width: 100%; border-radius: 15px;">
    <div class="card-header bg-white border-0 pt-5 pb-2 text-center">
      <div class="bg-primary bg-gradient text-white d-inline-block p-3 rounded-circle mb-3 shadow">
        <i class="bi bi-shield-lock fs-1"></i>
      </div>
      <h2 class="fw-bold text-dark">Connexion</h2>
      <p class="text-muted">Accédez à votre espace Banking sécurisé</p>
    </div>

    <div class="card-body p-4 p-md-5 pt-md-0">
      <form [formGroup]="formLogin" (ngSubmit)="handleLogin()">
        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary small text-uppercase ls-1">
            Utilisateur
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" class="form-control bg-light border-start-0 ps-0 py-2" formControlName="username" placeholder="Entrez votre login">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary small text-uppercase ls-1">
            Mot de passe
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
            <input type="password" class="form-control bg-light border-start-0 ps-0 py-2" formControlName="password" placeholder="••••••••">
          </div>
        </div>

        <div class="d-grid gap-2 pt-2">
          <button class="btn btn-primary btn-lg shadow-sm fw-bold border-0 bg-gradient py-3" style="border-radius: 10px;">
            Se connecter
          </button>
        </div>

        <div class="text-center mt-4">
          <small class="text-muted">Système de sécurité certifié JWT</small>
        </div>
      </form>
    </div>
  </div>
</div>
